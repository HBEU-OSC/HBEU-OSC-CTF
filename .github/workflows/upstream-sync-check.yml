name: Upstream sync check

on:
  schedule:
    # 每周一 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Hello-CTF upstream updates
        run: python tools/sync_upstream.py check

      - name: Write job summary
        if: always()
        run: cat .sync/reports/upstream-sync.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report
          path: .sync/reports/
          if-no-files-found: warn
